<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180">
    <!-- X mark (left) — solid filled wedges with curved swoosh -->
    <g transform="translate(20, 20)">
        <!-- Left diagonal (white→dark on dark bg; we use solid dark for light bg) -->
        <path d="M 0 0 L 26 0 L 88 140 L 62 140 Z" fill="#0d0f12"/>
        <!-- Right diagonal (slightly lighter wedge) -->
        <path d="M 78 60 L 104 60 L 104 140 L 60 140 Z" fill="#2a2d32"/>
        <!-- Swoosh — curved arc that crosses the top of the X -->
        <path d="M 14 10 Q 90 -10 110 80 Q 108 50 96 32 Q 70 4 18 10 Z" fill="#0d0f12"/>
    </g>
    <!-- TOMORROW wordmark -->
    <text x="170" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="86" letter-spacing="4" fill="#0d0f12">TOMORROW</text>
</svg>
